name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Diário, 11:00 UTC (08:00 em America/Sao_Paulo, sem horário de verão).
    # O build relê o Marketplace e a API do GitHub.
    - cron: "0 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          # enablement exige um token que não seja o GITHUB_TOKEN.
          # Sem o secret PAGES_TOKEN, este passo só lê a configuração atual.
          # Para criar o site automaticamente, defina PAGES_TOKEN:
          # PAT com escopo repo (ou Pages write), ou GitHub App com
          # administration:write e pages:write.
          enablement: ${{ secrets.PAGES_TOKEN != '' }}
          token: ${{ secrets.PAGES_TOKEN || github.token }}

      - name: Install, build, and upload
        uses: withastro/action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASTRO_TELEMETRY_DISABLED: "1"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
